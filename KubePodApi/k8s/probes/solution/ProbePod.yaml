apiVersion: v1
kind: Pod
metadata:
  name: probes-exercise
  labels:
    app: probes-exercise
spec:
  containers:
    - name: api
      image: probe-pod:exercise-v1
      imagePullPolicy: Never
      ports:
        - containerPort: 80
      env:
        - name: CALLS_BEFORE_SUCCESS
          value: "4"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      startupProbe:
        httpGet:
          path: /healthz/startup
          port: 80
        periodSeconds: 5
        failureThreshold: 5
      readinessProbe:
        httpGet:
          path: /healthz/readiness
          port: 80
        periodSeconds: 5
        failureThreshold: 1
      livenessProbe:
        httpGet:
          path: /healthz/liveness
          port: 80
        periodSeconds: 5
        failureThreshold: 3
