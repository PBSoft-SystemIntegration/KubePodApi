apiVersion: v1
kind: Pod
metadata:
  name: probes-exercise
  labels:
    app: probes-exercise
spec:
  containers:
    - name: api
      image: probe-pod:exercise-v1
      imagePullPolicy: Never
      ports:
        - containerPort: 80
      env:
        - name: CALLS_BEFORE_SUCCESS
          value: "4"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      # Udfyld selv under containeren (samme niveau som env):
      # 1. startupProbe: /healthz/startup
      # 2. readinessProbe: /healthz/readiness
      # 3. livenessProbe: /healthz/liveness
      # Brug httpGet, port 80, periodSeconds og failureThreshold.
