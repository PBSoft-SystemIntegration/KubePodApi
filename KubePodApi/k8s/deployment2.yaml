apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-info-deployment2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pod-info2
  template:
    metadata:
      labels:
        app: pod-info2
    spec:
      containers:
        - name: pod-info-container2
          image: emilstephansen/kube_image_rest:0.1.0
          ports:
            - containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP


